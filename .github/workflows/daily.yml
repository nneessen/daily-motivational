name: Morning texts

on:
  # A cron-job.org timer set to Denver time starts this at 5:17 AM, Monday to Friday, through GitHub's API.
  # GitHub's own schedule never fired for this repo, so there is no schedule here (see README).
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Write and email this morning's texts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
        run: go run .
